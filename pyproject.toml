[project]
name = "hermes-carddav-contacts"
version = "0.1.0"
description = "Reusable, distributable CardDAV contacts skill for Hermes Agent skills"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "vdirsyncer==0.21.0",
    "vobject==0.9.9",
]

[project.optional-dependencies]
khard = [
    "khard==0.19.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.6",
    "mypy==2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skills"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
