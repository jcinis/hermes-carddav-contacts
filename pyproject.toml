[project]
name = "hermes-carddav-contacts"
version = "0.1.0"
description = "Reusable, distributable CardDAV contacts skill for Hermes Agent skills"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "vdirsyncer==0.21.0",
    "vobject==0.9.9",
]

[project.scripts]
hermes-carddav-contacts = "hermes_carddav_contacts:main"

[project.optional-dependencies]
khard = [
    "khard==0.19.1",
]

[dependency-groups]
integration = [
    "Radicale==3.5.8",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.6",
    "mypy==2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_carddav_contacts", "skills"]

# Explicit public-artifact boundary: only these entries ship. Runtime state
# (profiles, mirrors, indexes, logs) lives outside the checkout and is never
# a build input.
[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
    "/hermes_carddav_contacts",
    "/skills",
    "/tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "-m 'not integration and not packaging'"
markers = [
    "integration: disposable localhost CardDAV server and real vdirsyncer",
    "packaging: real uv build plus a fresh installed virtualenv outside the checkout",
]
